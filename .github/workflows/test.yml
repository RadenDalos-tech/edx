name: edX CI/CD Pipeline 2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Для работы с историей коммитов

      - name: Setup Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev libssl-dev libffi-dev
          sudo apt-get install -y pandoc  # Добавляем установку Pandoc

      - name: Upgrade pip and setuptools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools

      - name: Fix requirements format
        run: |
          # Преобразуем формат зависимостей
          sed -i 's/git\+https:\/\/github.com\/edx\/codejail.git@3.1.3#egg=codejail==3.1.3/codejail @ git+https:\/\/github.com\/edx\/codejail.git@3.1.3/g' requirements/edx/base.txt
          sed -i 's/git\+https:\/\/github.com\/edx\/django-ratelimit-backend.git@v2.0.1a5#egg=django-ratelimit-backend==2.0.1a5/django-ratelimit-backend @ git+https:\/\/github.com\/edx\/django-ratelimit-backend.git@v2.0.1a5/g' requirements/edx/base.txt
          sed -i 's/git\+https:\/\/github.com\/edx\/MongoDBProxy.git@d92bafe9888d2940f647a7b2b2383b29c752f35a#egg=MongoDBProxy==0.1.0+edx.2/MongoDBProxy @ git+https:\/\/github.com\/edx\/MongoDBProxy.git@d92bafe9888d2940f647a7b2b2383b29c752f35a/g' requirements/edx/base.txt
          # Добавьте аналогичные строки для остальных зависимостей

      - name: Install Python dependencies
        run: |
          pip cache purge  # Очищаем кэш pip
          pip install -r requirements/edx/base.txt
          pip install -r requirements/edx/development.txt

      - name: Setup edX environment
        run: |
          make requirements
          make l10n

      - name: Run linting
        run: |
          make lint

      - name: Run tests
        run: |
          make test

      - name: Build Docker image
        run: |
          docker build -t edx-platform:latest .
          docker tag edx-platform:latest ${{ secrets.DOCKER_REGISTRY }}/edx-platform:latest
