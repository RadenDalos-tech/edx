name: edX CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Для работы с историей коммитов

      - name: Setup Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev libssl-dev libffi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/edx/base.txt
          pip install -r requirements/edx/development.txt

      - name: Setup edX environment
        run: |
          make requirements
          make l10n

      - name: Run linting
        run: |
          make lint

      - name: Run tests
        run: |
          make test

      - name: Build Docker image
        run: |
          docker build -t edx-platform:latest .
          docker tag edx-platform:latest ${{ secrets.DOCKER_REGISTRY }}/edx-platform:latest
