name: edX CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Сборка и тестирование Docker образа
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: edx-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/edx-platform.tar

      - name: Load and test Docker image
        run: |
          echo "Loading Docker image..."
          docker load -i /tmp/edx-platform.tar
          
          echo "Testing if container starts..."
          docker run --rm -d --name test-container -p 8000:80 edx-platform:latest
          sleep 10
          
          echo "Checking container status..."
          docker ps | grep test-container && echo "✅ Container is running" || echo "❌ Container failed to start"
          
          echo "Stopping test container..."
          docker stop test-container && echo "✅ Test container stopped"

  # Сканирование безопасности контейнера
  sca:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Build and scan
        run: |
          # Собираем образ
          docker build -t edx-platform:scan .
          
          # Устанавливаем Trivy
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          
          # Запускаем сканирование
          echo "🔒 Running security scan..."
          trivy image --severity CRITICAL,HIGH --exit-code 0 edx-platform:scan
          echo "✅ Security scan completed"

      - name: Upload simple report
        run: |
          echo "Security scan finished at: $(date)" > security-scan.txt
          echo "Image: edx-platform:scan" >> security-scan.txt
          echo "Status: Completed" >> security-scan.txt

      - name: Upload scan summary
        uses: actions/upload-artifact@v4
        with:
          name: sca-summary
          path: security-scan.txt

  # Статический анализ кода
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install SAST tools
        run: |
          pip install bandit safety semgrep

      - name: Run Bandit security scan
        run: |
          bandit -r . -f json -o bandit-report.json . || echo "Bandit scan completed"

      - name: Run Safety dependencies check
        run: |
          safety check --json --output safety-report.json || echo "Safety check completed"

      - name: Run Semgrep static analysis
        run: |
          semgrep scan --config=auto --json -o semgrep-report.json || echo "Semgrep scan completed"

      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            bandit-report.json
            safety-report.json
            semgrep-report.json

        # Деплой на сервер
  deploy:
    needs: [build, sca, sast]
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' || 
       github.ref == 'refs/heads/develop' || 
       github.event_name == 'workflow_dispatch')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show deployment info
        run: |
          echo "🚀 Starting deployment..."
          echo "📦 Branch: ${GITHUB_REF#refs/heads/}"
          echo "🎯 Target: ${{ secrets.SERVER_IP }}"

      - name: Setup SSH properly
        run: |
          echo "Setting up SSH connection..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Правильно записываем приватный ключ
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Добавляем сервер в known_hosts
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          
          echo "SSH setup completed"

      - name: Test SSH connection
        run: |
          echo "Testing SSH connection to server..."
          ssh -o BatchMode=yes -o ConnectTimeout=5 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "echo '✅ SSH connection successful'" || echo "❌ SSH connection failed"

      - name: Build application image
        run: |
          echo "Building Docker image..."
          docker build -t edx-platform:${{ github.sha }} .

      - name: Deploy to server
        run: |
          echo "Deploying to ${{ secrets.SERVER_IP }}..."
          
          # Сохраняем образ в файл
          docker save edx-platform:${{ github.sha }} > /tmp/edx-image.tar
          
          # Копируем на сервер и разворачиваем
          scp /tmp/edx-image.tar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/tmp/
          
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          set -e
          echo "=== Starting deployment on server ==="
          
          echo "Loading Docker image..."
          docker load -i /tmp/edx-image.tar
          
          echo "Stopping old container..."
          docker stop edx-platform || true
          docker rm edx-platform || true
          
          echo "Starting new container..."
          docker run -d \
            --name edx-platform \
            --restart unless-stopped \
            -p 80:80 \
            edx-platform:${{ github.sha }}
          
          echo "Cleaning up..."
          rm /tmp/edx-image.tar
          
          echo "✅ Deployment completed successfully"
          EOF

      - name: Verify deployment
        run: |
          echo "Waiting for application to start..."
          sleep 30
          echo "Verifying deployment..."
          
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          set -e
          echo "=== Deployment Verification ==="
          echo "Container status:"
          docker ps | grep edx-platform && echo "✅ Container is running" || echo "❌ Container not found"
          echo "Application health check:"
          curl -f http://localhost:80/ && echo "✅ Application is responding" || echo "❌ Application health check failed"
          echo "=== Verification Complete ==="
          EOF

      - name: Store URL for DAST
        run: |
          echo "APPLICATION_URL=http://${{ secrets.SERVER_IP }}" >> $GITHUB_ENV
          echo "DAST target: http://${{ secrets.SERVER_IP }}"

      - name: Send deployment notification
        run: |
          echo "🎉 Application successfully deployed to ${{ secrets.SERVER_IP }}"
          echo "🌐 Access your application at: http://${{ secrets.SERVER_IP }}"
