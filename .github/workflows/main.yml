name: edX CI/CD Pipeline

# События, при которых запускается пайплайн
on:
  workflow_dispatch:
  push: # При пуше в репозиторий
    branches: # Список веток для отслеживания
      - main # Основная ветка
      - develop # Ветка разработки
  pull_request: # При создании pull request
    branches:
      - main
      - develop

# Определение всех заданий в пайплайне
jobs:
  # Задание для сборки проекта
  build:
    runs-on: ubuntu-latest # Запуск на последней версии Ubuntu
    steps: # Шаги сборки
      - name: Checkout repository # Клонирование репозитория
        uses: actions/checkout@v3 # Использование стандартного экшена для чекаута
        
      - name: Setup Python environment # Настройка окружения Python
        uses: actions/setup-python@v4 # Использование экшена для установки Python
        with:
          python-version: '3.8' # Указание версии Python
          
      - name: Install project dependencies # Установка зависимостей
        run: | # Выполнение команд
          sudo apt-get update # Обновление пакетов системы
          pip install -r requirements/edx/base.txt # Установка базовых зависимостей
          pip install -r requirements/edx/development.txt # Установка dev зависимостей
          
      - name: Setup edX environment # Настройка окружения edX
        run: |
          make requirements # Установка требований проекта
          make l10n # Настройка локализации
          
      - name: Run tests # Запуск тестов
        run: |
          make test # Выполнение тестового набора
          
      - name: Build Docker image # Сборка Docker образа
        run: |
          docker build -t edx-platform:latest . # Сборка образа с тегом latest

  # Этап сканирования безопасности Trivy
  sca:
    needs: build # Зависимость от успешного завершения сборки
    runs-on: ubuntu-latest # Запуск на последней версии Ubuntu
    steps: # Шаги сканирования
      - name: Checkout repository # Клонирование репозитория
        uses: actions/checkout@v3 # Использование стандартного экшена
        
      - name: Set up Docker Buildx # Настройка Docker Buildx
        uses: docker/setup-buildx-action@v2 # Использование специального экшена
        
      - name: Login to Docker Hub # Авторизация в Docker Hub
        uses: docker/login-action@v2 # Использование экшена для входа
        with: # Параметры для входа
          username: ${{ secrets.DOCKER_HUB_USERNAME }} # Имя пользователя из секретов
          password: ${{ secrets.DOCKER_HUB_PASSWORD }} # Пароль из секретов
          
      - name: Pull Docker image # Загрузка Docker-образа
        run: |
          docker pull ${{ secrets.DOCKER_REGISTRY }}/edx-platform:latest # Команда для загрузки
          
      - name: Setup Trivy # Настройка Trivy для сканирования
        uses: aquasecurity/trivy-action@master # Использование экшена Trivy
        with: # Параметры сканирования
          image-ref: ${{ secrets.DOCKER_REGISTRY }}/edx-platform:latest # Образ для проверки
          format: json # Формат вывода отчета
          output: trivy-report.json # Имя файла отчета
          severity: CRITICAL,HIGH # Уровни уязвимостей для проверки
          
      - name: Upload Trivy report # Загрузка отчета о сканировании
        uses: actions/upload-artifact@v3 # Использование экшена для загрузки
        with: # Параметры загрузки
          name: trivy-report # Имя артефакта
          path: trivy-report.json # Путь к файлу отчета

  # Статический анализ безопасности
  sast:
    needs: build # Зависимость от успешного завершения сборки
    runs-on: ubuntu-latest # Запуск на последней версии Ubuntu
    steps: # Шаги выполнения
      - name: Repository checkout # Клонирование репозитория
        uses: actions/checkout@v3 # Использование стандартного экшена

      - name: Python setup # Настройка окружения Python
        uses: actions/setup-python@v4 # Использование экшена для установки
        with:
          python-version: '3.8' # Указание версии Python

      - name: Security tools installation # Установка инструментов безопасности
        run: | # Выполнение команд
          pip install bandit # Установка Bandit для анализа кода
          npm install -g semgrep # Глобальная установка Semgrep

      - name: Bandit scan execution # Запуск сканирования Bandit
        run: | # Выполнение команды
          bandit -r . -lll -x venv -f json > bandit_report.json # Сканирование и сохранение отчета

      - name: Semgrep scan execution # Запуск сканирования Semgrep
        run: | # Выполнение команды
          semgrep ci --config=auto # Автоматическое сканирование

      - name: SAST reports upload # Загрузка отчетов
        uses: actions/upload-artifact@v3 # Использование экшена для загрузки
        with:
          name: sast-reports # Имя артефакта
          path: | # Пути к файлам отчетов
            bandit_report.json # Отчет Bandit
            semgrep-results.json # Отчет Semgrep

  # Динамический анализ безопасности
  dast:
    needs: sast # Зависимость от успешного завершения SAST
    runs-on: ubuntu-latest # Запуск на последней версии Ubuntu
    steps: # Шаги выполнения
      - name: Repository checkout # Клонирование репозитория
        uses: actions/checkout@v3 # Использование стандартного экшена

      - name: ZAP setup # Настройка ZAP
        uses: zaproxy/zaproxy-github-action@v1 # Использование экшена ZAP
        with:
          zapVersion: '2.11.0' # Версия ZAP для использования

      - name: ZAP daemon start # Запуск демона ZAP
        run: | # Выполнение команды
          zap-cli start -d # Запуск в демодном режиме

      - name: ZAP scanning # Выполнение сканирования
        run: | # Выполнение команды сканирования
          zap-cli quick-scan ${{ secrets.EDX_APP_URL }} \
            -t 15000 \ # Таймаут сканирования
            -r dast_report.html # Сохранение отчета

      - name: DAST reports upload # Загрузка отчетов
        uses: actions/upload-artifact@v3 # Использование экшена для загрузки
        with:
          name: dast-reports # Имя артефакта
          path: dast_report.html # Путь к отчету

  # Задание деплоймента
  deploy:
    needs: [build, sca, sast] # Зависимости от предыдущих этапов
    runs-on: ubuntu-latest # Конфигурация окружения выполнения
    
    # Определение переменных окружения для удобства использования
    env:
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}  # Пользователь для SSH-подключения
      VPS_IP: ${{ secrets.VPS_IP }}            # IP-адрес сервера
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}  # Репозиторий Docker

    steps:
      # Шаг 1: Клонирование репозитория
      - name: Checkout repository
        uses: actions/checkout@v3  # Использование стандартного экшена для чекаута

      # Шаг 2: Авторизация в Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2  # Использование специального экшена для входа
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}  # Имя пользователя из секретов
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}  # Пароль из секретов

      # Шаг 3: Сборка и публикация Docker-образа
      - name: Build and push Docker image
        uses: docker/build-push-action@v3  # Использование экшена для сборки и публикации
        with:
          context: .  # Контекст сборки (текущая директория)
          push: true  # Флаг для публикации образа
          tags: ${{ env.DOCKER_REGISTRY }}/edx-platform:latest  # Тег для публикации

      # Шаг 4: Подготовка SSH-окружения
      - name: Prepare SSH environment
        run: |  # Выполнение команд
          mkdir -p ~/.ssh  # Создание директории для SSH-ключей
          ssh-keyscan -H ${{ env.VPS_IP }} >> ~/.ssh/known_hosts  # Добавление хоста в known_hosts
          chmod 600 ~/.ssh/known_hosts  # Установка правильных прав доступа

      # Шаг 5: Создание резервной копии текущего контейнера
      - name: Backup current container
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.VPS_IP }} << EOF  # Подключение по SSH
          docker container prune -f  # Очистка неиспользуемых контейнеров
          docker image prune -f  # Очистка неиспользуемых образов
          docker commit edx-platform ${{ env.DOCKER_REGISTRY }}/edx-platform:backup-$(date +%Y%m%d%H%M%S)  # Создание снапшота
          EOF

      # Шаг 6: Развертывание на VPS
      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ env.DEPLOY_USER }}@${{ env.VPS_IP }} << 'EOF'  # Подключение по SSH с автоматической проверкой ключа
          set -euxo pipefail  # Включение строгого режима обработки ошибок

          # Остановка и удаление существующего контейнера
          if [ "$(docker ps -aq -f name=edx-platform)" ]; then
            docker stop edx-platform
            docker rm edx-platform
          fi

          # Загрузка нового образа
          docker pull ${{ env.DOCKER_REGISTRY }}/edx-platform:latest

          # Запуск нового контейнера
          docker run -d --name edx-platform \
            -p 80:80 \
            -e ENV=production \
            ${{ env.DOCKER_REGISTRY }}/edx-platform:latest

          # Ожидание запуска сервиса
          sleep 60

          # Проверка работоспособности сервиса
          if ! curl --silent --head --fail http://localhost; then
            echo "Service is not responding, rolling back..."  # Сообщение об ошибке
            docker stop edx-platform
            docker rm edx-platform
            # Восстановление из бэкапа (нужно доработать логику)
            exit 1
          fi
          EOF

      # Шаг 7: Очистка старых бэкапов
      - name: Clean up old backups
        if: always()  # Выполнение всегда, даже при ошибке
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.VPS_IP }} << 'EOF'
          # Очистка образов старше 7 дней
          docker images --filter "reference=${{ env.DOCKER_REGISTRY }}/edx-platform:backup-*" --format "{{.ID}} {{.CreatedSince}}" | \
          grep -E "([5-9][0-9]|1[0-9][0-9]) days|[2-9][0-9][0-9] days" | \
          awk '{print $1}' | \
          xargs -r docker rmi || true
          EOF
