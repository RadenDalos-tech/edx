name: edX CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Сборка и тестирование Docker образа
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: edx-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/edx-platform.tar

      - name: Load and test Docker image
        run: |
          echo "Loading Docker image..."
          docker load -i /tmp/edx-platform.tar
          
          echo "Testing if container starts..."
          docker run --rm -d --name test-container -p 8000:80 edx-platform:latest
          sleep 10
          
          echo "Checking container status..."
          docker ps | grep test-container && echo "✅ Container is running" || echo "❌ Container failed to start"
          
          echo "Stopping test container..."
          docker stop test-container && echo "✅ Test container stopped"

  # Сканирование безопасности контейнера
  sca:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Build and scan
        run: |
          # Собираем образ
          docker build -t edx-platform:scan .
          
          # Устанавливаем Trivy
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          
          # Запускаем сканирование
          echo "🔒 Running security scan..."
          trivy image --severity CRITICAL,HIGH --exit-code 0 edx-platform:scan
          echo "✅ Security scan completed"

      - name: Upload simple report
        run: |
          echo "Security scan finished at: $(date)" > security-scan.txt
          echo "Image: edx-platform:scan" >> security-scan.txt
          echo "Status: Completed" >> security-scan.txt

      - name: Upload scan summary
        uses: actions/upload-artifact@v4
        with:
          name: sca-summary
          path: security-scan.txt

  # Статический анализ кода
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install SAST tools
        run: |
          pip install bandit safety semgrep

      - name: Run Bandit security scan
        run: |
          bandit -r . -f json -o bandit-report.json . || echo "Bandit scan completed"

      - name: Run Safety dependencies check
        run: |
          safety check --json --output safety-report.json || echo "Safety check completed"

      - name: Run Semgrep static analysis
        run: |
          semgrep scan --config=auto --json -o semgrep-report.json || echo "Semgrep scan completed"

      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            bandit-report.json
            safety-report.json
            semgrep-report.json

       # Деплой на сервер
  deploy:
    needs: [build, sca, sast]
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' || 
       github.ref == 'refs/heads/develop' || 
       github.event_name == 'workflow_dispatch')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show deployment info
        run: |
          echo "🚀 Starting deployment..."
          echo "📦 Branch: ${GITHUB_REF#refs/heads/}"
          echo "🎯 Target: ${{ secrets.SERVER_IP }}"
          echo "👤 User: ${{ secrets.SERVER_USER }}"

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass openssh-client

      - name: Setup SSH known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || echo "Known hosts setup completed"

      - name: Debug connection issues
        run: |
          echo "=== Connection Diagnostics ==="
          echo "1. Testing network connectivity..."
          ping -c 2 ${{ secrets.SERVER_IP }} || echo "Ping failed - server may be down"
          
          echo "2. Testing SSH port..."
          nc -z -w 5 ${{ secrets.SERVER_IP }} 22 && echo "✅ SSH port 22 is open" || echo "❌ SSH port 22 is closed"
          
          echo "3. Testing SSH with verbose output..."
          sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -o BatchMode=no -o ConnectTimeout=10 -v ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "echo 'SSH test'" || echo "SSH connection failed"

      - name: Try alternative authentication methods
        run: |
          echo "=== Alternative Authentication Methods ==="
          
          # Метод 1: Прямой sshpass
          echo "Method 1: Direct sshpass"
          sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "echo 'Method 1: Success'" || echo "Method 1: Failed"
          
          # Метод 2: Через переменную окружения
          echo "Method 2: Environment variable"
          SSHPASS='${{ secrets.SSH_PASSWORD }}' sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "echo 'Method 2: Success'" || echo "Method 2: Failed"
          
          # Метод 3: Без strict host checking
          echo "Method 3: No strict host checking"
          sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "echo 'Method 3: Success'" || echo "Method 3: Failed"

      - name: Build application image
        if: always()
        run: |
          echo "Building Docker image..."
          docker build -t edx-platform:${{ github.sha }} .

      - name: Final connection test
        run: |
          echo "=== Final Connection Test ==="
          if sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -o BatchMode=no -o ConnectTimeout=10 -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "echo '✅ FINAL: SSH successful'"; then
            echo "🎉 SSH connection successful - ready for deployment"
          else
            echo "❌ SSH connection failed - check credentials"
            echo ""
            echo "🔧 Common Issues:"
            echo "1. Wrong username/password"
            echo "2. Server firewall blocking SSH"
            echo "3. SSH service not running on server"
            echo "4. IP address changed"
            echo ""
            echo "💡 Questions to verify:"
            echo "- Can you SSH manually from your local machine?"
            echo "- Is the password definitely correct?"
            echo "- Is the server definitely ${{ secrets.SERVER_IP }}?"
            exit 1
          fi
