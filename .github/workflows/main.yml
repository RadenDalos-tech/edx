name: edX CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Сборка и тестирование Docker образа
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: edx-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/edx-platform.tar

      - name: Load and test Docker image
        run: |
          echo "Loading Docker image..."
          docker load -i /tmp/edx-platform.tar
          
          echo "Testing if container starts..."
          docker run --rm -d --name test-container -p 8000:80 edx-platform:latest
          sleep 10
          
          echo "Checking container status..."
          docker ps | grep test-container && echo "✅ Container is running" || echo "❌ Container failed to start"
          
          echo "Checking container logs..."
          docker logs test-container || echo "No logs available"
          
          echo "Stopping test container..."
          docker stop test-container && echo "✅ Test container stopped"

  # Сканирование безопасности контейнера
  sca:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build image for scanning
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: edx-platform:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: edx-platform:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Статический анализ кода
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install SAST tools
        run: |
          pip install bandit safety
          npm install -g @semgrep/semgrep

      - name: Run Bandit
        run: |
          bandit -r . -f json -o bandit-report.json . || true

      - name: Run Semgrep
        run: |
          semgrep scan --config=auto --json -o semgrep-report.json || true

      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            bandit-report.json
            semgrep-report.json

  # Деплой на сервер
  deploy:
    needs: [build, sca, sast]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: edx-platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/edx-platform.tar.gz

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          # Копируем образ на сервер
          scp /tmp/edx-platform.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/tmp/
          
          # Деплой на сервер
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          set -e
          
          echo "=== Starting deployment ==="
          
          # Загружаем образ
          docker load -i /tmp/edx-platform.tar.gz
          
          # Останавливаем старый контейнер если существует
          if [ "$(docker ps -aq -f name=edx-platform)" ]; then
            echo "Stopping old container..."
            docker stop edx-platform || true
            docker rm edx-platform || true
          fi
          
          # Запускаем новый контейнер
          echo "Starting new container..."
          docker run -d \
            --name edx-platform \
            --restart unless-stopped \
            -p 80:80 \
            edx-platform:${{ github.sha }}
          
          # Очистка
          rm /tmp/edx-platform.tar.gz
          docker system prune -f
          
          echo "=== Deployment completed ==="
          EOF

      - name: Verify deployment
        run: |
          sleep 10
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          echo "=== Verifying deployment ==="
          
          # Проверяем что контейнер запущен
          docker ps | grep edx-platform && echo "✅ Container is running" || echo "❌ Container not found"
          
          # Ждем запуска приложения
          sleep 20
          
          # Проверяем доступность
          curl -f http://localhost:80/ && echo "✅ Application is responding" || echo "❌ Application health check failed"
          
          echo "=== Verification completed ==="
          EOF

      - name: Store application URL for DAST
        run: |
          echo "APPLICATION_URL=http://${{ secrets.SERVER_IP }}" >> $GITHUB_ENV

      - name: Send deployment notification
        run: |
          echo "🎉 Application successfully deployed to ${{ secrets.SERVER_IP }}"
          echo "🌐 Access your application at: http://${{ secrets.SERVER_IP }}"

  # Динамический анализ безопасности (DAST)
  dast:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for application to be ready
        run: |
          echo "Waiting for application to be ready..."
          timeout 60s bash -c 'until curl -f http://${{ secrets.SERVER_IP }}; do sleep 5; done' || echo "Application ready check completed"

      - name: Simple DAST with curl checks
        run: |
          echo "=== Running basic security checks ==="
          
          # Проверяем основные эндпоинты
          curl -I http://${{ secrets.SERVER_IP }} && echo "✅ Main page accessible"
          
          # Проверяем заголовки безопасности
          curl -I http://${{ secrets.SERVER_IP }} | grep -i "server:" || echo "⚠️  Server header visible"
          
          echo "=== Basic DAST completed ==="

      - name: Upload DAST report
        uses: actions/upload-artifact@v4
        with:
          name: dast-basic-report
          path: |
            ./*.txt
          retention-days: 30
