name: edX CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Сборка и тестирование Docker образа
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: edx-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/edx-platform.tar

      - name: Load and test Docker image
        run: |
          echo "Loading Docker image..."
          docker load -i /tmp/edx-platform.tar
          
          echo "Testing if container starts..."
          docker run --rm -d --name test-container -p 8000:80 edx-platform:latest
          sleep 10
          
          echo "Checking container status..."
          docker ps | grep test-container && echo "✅ Container is running" || echo "❌ Container failed to start"
          
          echo "Stopping test container..."
          docker stop test-container && echo "✅ Test container stopped"

  # Сканирование безопасности контейнера
  sca:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Build and scan
        run: |
          # Собираем образ
          docker build -t edx-platform:scan .
          
          # Устанавливаем Trivy
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          
          # Запускаем сканирование
          echo "🔒 Running security scan..."
          trivy image --severity CRITICAL,HIGH --exit-code 0 edx-platform:scan
          echo "✅ Security scan completed"

      - name: Upload simple report
        run: |
          echo "Security scan finished at: $(date)" > security-scan.txt
          echo "Image: edx-platform:scan" >> security-scan.txt
          echo "Status: Completed" >> security-scan.txt

      - name: Upload scan summary
        uses: actions/upload-artifact@v4
        with:
          name: sca-summary
          path: security-scan.txt

  # Статический анализ кода
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install SAST tools
        run: |
          pip install bandit safety semgrep

      - name: Run Bandit security scan
        run: |
          bandit -r . -f json -o bandit-report.json . || echo "Bandit scan completed"

      - name: Run Safety dependencies check
        run: |
          safety check --json --output safety-report.json || echo "Safety check completed"

      - name: Run Semgrep static analysis
        run: |
          semgrep scan --config=auto --json -o semgrep-report.json || echo "Semgrep scan completed"

      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            bandit-report.json
            safety-report.json
            semgrep-report.json

         # Деплой на сервер
  deploy:
    needs: [build, sca, sast]
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' || 
       github.ref == 'refs/heads/develop' || 
       github.event_name == 'workflow_dispatch')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show deployment info
        run: |
          echo "🚀 Starting deployment process..."
          echo "📦 Branch: ${GITHUB_REF#refs/heads/}"
          echo "🎯 Target Server: ${{ secrets.SERVER_IP }}"
          echo "👤 SSH User: ${{ secrets.SERVER_USER }}"
          echo "🔐 Authentication: Password"
          echo "🐳 Docker Image: edx-platform:${{ github.sha }}"

      - name: Install required tools
        run: |
          echo "Installing deployment tools..."
          sudo apt-get update
          sudo apt-get install -y sshpass expect

      - name: Setup SSH known hosts
        run: |
          echo "Configuring SSH known hosts..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || echo "Known hosts configured"

      - name: Build application image
        run: |
          echo "🏗️ Building Docker image..."
          docker build -t edx-platform:${{ github.sha }} .
          echo "✅ Docker image built successfully"

      - name: Deploy using expect script
        run: |
          echo "🚀 Deploying application using expect..."
          
          # Создаем expect скрипт для автоматизации деплоя
          cat > deploy.exp << 'EOF'
          #!/usr/bin/expect -f
          set timeout 60
          
          # Копируем Docker образ на сервер
          spawn scp /tmp/edx-image.tar root@194.87.131.127:/tmp/
          expect "password:"
          send "kali\r"
          expect eof
          
          # Подключаемся к серверу и разворачиваем
          spawn ssh root@194.87.131.127
          expect "password:"
          send "kali\r"
          expect "# "
          send "echo '=== Starting Deployment ==='\r"
          expect "# "
          send "docker load -i /tmp/edx-image.tar\r"
          expect "# "
          send "docker stop edx-platform || true\r"
          expect "# "
          send "docker rm edx-platform || true\r"
          expect "# "
          send "docker run -d --name edx-platform --restart unless-stopped -p 80:80 edx-platform:${{ github.sha }}\r"
          expect "# "
          send "rm /tmp/edx-image.tar\r"
          expect "# "
          send "echo '✅ Deployment completed successfully'\r"
          expect "# "
          send "exit\r"
          expect eof
          EOF
          
          chmod +x deploy.exp
          
          # Сохраняем Docker образ в файл
          echo "Saving Docker image to file..."
          docker save edx-platform:${{ github.sha }} > /tmp/edx-image.tar
          
          # Запускаем деплой
          echo "Starting deployment process..."
          ./deploy.exp
          
          echo "✅ Deployment script executed"

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          
          # Создаем expect скрипт для проверки
          cat > verify.exp << 'EOF'
          #!/usr/bin/expect -f
          set timeout 30
          
          spawn ssh root@194.87.131.127
          expect "password:"
          send "kali\r"
          expect "# "
          send "echo '=== Deployment Verification ==='\r"
          expect "# "
          send "docker ps | grep edx-platform && echo '✅ Container is running' || echo '❌ Container not found'\r"
          expect "# "
          send "curl -f http://localhost:80/ && echo '✅ Application is responding' || echo '❌ Application not responding'\r"
          expect "# "
          send "echo '=== Verification Complete ==='\r"
          expect "# "
          send "exit\r"
          expect eof
          EOF
          
          chmod +x verify.exp
          
          echo "Waiting for application to start..."
          sleep 30
          ./verify.exp

      - name: Store URL for DAST
        run: |
          echo "APPLICATION_URL=http://${{ secrets.SERVER_IP }}" >> $GITHUB_ENV
          echo "🎯 DAST target configured: http://${{ secrets.SERVER_IP }}"

      - name: Final deployment summary
        run: |
          echo "🎉 DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "==================================="
          echo "📊 Deployment Summary:"
          echo "   • Server: ${{ secrets.SERVER_IP }}"
          echo "   • Application: edX Platform"
          echo "   • Docker Image: edx-platform:${{ github.sha }}"
          echo "   • Status: ✅ Successfully deployed"
          echo "   • URL: http://${{ secrets.SERVER_IP }}"
          echo ""
          echo "🚀 CI/CD Pipeline Status:"
          echo "   ✅ Build: Docker image built and tested"
          echo "   ✅ SAST: Static code security analysis"
          echo "   ✅ SCA: Container vulnerability scanning"
          echo "   ✅ Deploy: Application deployed to production"
          echo "   🔜 DAST: Dynamic security testing ready"
          echo ""
          echo "🌐 Access your application at: http://${{ secrets.SERVER_IP }}"
