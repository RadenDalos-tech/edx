name: edX CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Сборка образа с улучшенной диагностикой
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Полная история для safe_lxml
          
      - name: Debug repository structure
        run: |
          echo "📁 Repository structure:"
          find . -name "*safe_lxml*" -type f | head -20 || echo "No safe_lxml files found"
          echo ""
          echo "📁 Requirements structure:"
          find requirements/ -type f -name "*.txt" | head -10 || echo "No requirements found"
          echo ""
          echo "🔍 Checking for safe_lxml in code:"
          grep -r "safe_lxml" . --include="*.py" --include="*.txt" | head -5 || echo "No safe_lxml references found"
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        uses: docker/build-push-action@v4
        id: build
        with:
          context: .
          push: false
          tags: edx-platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/edx-platform.tar
          no-cache: false

      - name: Test Docker image and dependencies
        run: |
          echo "Loading and testing Docker image..."
          docker load -i /tmp/edx-platform.tar
          
          # Расширенная проверка зависимостей
          echo "🔍 Extended dependency check..."
          docker run --rm edx-platform:${{ github.sha }} python -c "
          import sys
          print('Python path:')
          for p in sys.path:
              print(' ', p)
              
          print('\n🔧 Checking critical modules:')
          modules_to_check = [
              'safe_lxml', 'django', 'lxml', 'pymysql', 
              'pkg_resources', 'setuptools'
          ]
          
          all_ok = True
          for module in modules_to_check:
              try:
                  __import__(module)
                  print(f'✅ {module}')
              except ImportError as e:
                  print(f'❌ {module}: {e}')
                  all_ok = False
          
          # Проверяем есть ли safe_lxml в путях
          print('\n🔎 Searching for safe_lxml:')
          import os
          for path in sys.path:
              safe_lxml_path = os.path.join(path, 'safe_lxml')
              if os.path.exists(safe_lxml_path):
                  print(f'📁 Found safe_lxml at: {safe_lxml_path}')
                  break
          else:
              print('❌ safe_lxml not found in Python path')
              
          if not all_ok:
              sys.exit(1)
              
          print('🎉 All dependencies verified successfully!')
          "

      - name: Save image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/edx-platform.tar
          retention-days: 1

  # Остальные jobs остаются без изменений (sca, sast, deploy, dast)
  sca:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          
      - name: Load and scan image
        run: |
          docker load -i edx-platform.tar
          docker tag edx-platform:${{ github.sha }} edx-platform:scan
          
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --severity CRITICAL,HIGH --exit-code 0 edx-platform:scan

  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install SAST tools
        run: |
          pip install bandit safety

      - name: Run Bandit security scan
        run: |
          bandit -r . -f json -o bandit-report.json . || echo "Bandit scan completed"

      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: bandit-report.json

  deploy:
    needs: [build, sca, sast]
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' || 
       github.ref == 'refs/heads/develop' || 
       github.event_name == 'workflow_dispatch')
    
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: |
          docker load -i edx-platform.tar
          echo "✅ Image loaded: edx-platform:${{ github.sha }}"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          echo "Deploying to server..."
          docker save edx-platform:${{ github.sha }} > /tmp/edx-image.tar
          scp -i ~/.ssh/id_rsa /tmp/edx-image.tar root@${{ secrets.SERVER_IP }}:/tmp/
          
          ssh -i ~/.ssh/id_rsa root@${{ secrets.SERVER_IP }} "
            set -e
            echo '=== Starting deployment ==='
            docker load -i /tmp/edx-image.tar
            docker stop edx-platform || true
            docker rm edx-platform || true
            docker run -d --name edx-platform --restart unless-stopped -p 80:8000 edx-platform:${{ github.sha }}
            rm /tmp/edx-image.tar
            echo '✅ Deployment completed'
          "

  # DAST и report остаются без изменений
