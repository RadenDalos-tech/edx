name: edX CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc pandoc-citeproc gettext  # Добавляем pandoc и другие системные зависимости
          
      - name: Setup Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
          
      - name: Upgrade pip and setuptools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          
      - name: Install project dependencies
        run: |
          # Сначала устанавливаем базовые зависимости без зависимостей, которые требуют pandoc
          pip install -r requirements/edx/base.txt --no-deps
          # Затем устанавливаем остальные зависимости
          pip install -r requirements/edx/base.txt
          pip install -r requirements/edx/development.txt
          
      - name: Setup edX environment
        run: |
          make requirements
          make l10n
          
      - name: Run tests
        run: |
          make test
          
      - name: Build Docker image
        run: |
          docker build -t edx-platform:latest .

  sca:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          
      - name: Pull Docker image
        run: |
          docker pull ${{ secrets.DOCKER_REGISTRY }}/edx-platform:latest
          
      - name: Setup Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_REGISTRY }}/edx-platform:latest
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH
          
      - name: Upload Trivy report
        uses: actions/upload-artifact@v3
        with:
          name: trivy-report
          path: trivy-report.json

  sast:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc pandoc-citeproc

      - name: Python setup
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Security tools installation
        run: |
          pip install bandit
          npm install -g @semgrep/semgrep

      - name: Bandit scan execution
        run: |
          bandit -r . -lll -x venv -f json > bandit_report.json || true

      - name: Semgrep scan execution
        run: |
          semgrep ci --config=auto --json > semgrep-results.json || true

      - name: SAST reports upload
        uses: actions/upload-artifact@v3
        with:
          name: sast-reports
          path: |
            bandit_report.json
            semgrep-results.json

  dast:
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v3

      - name: ZAP setup
        uses: zaproxy/zaproxy-github-action@v1
        with:
          zapVersion: '2.11.0'

      - name: ZAP daemon start
        run: |
          zap-cli start -d

      - name: ZAP scanning
        run: |
          zap-cli quick-scan ${{ secrets.EDX_APP_URL }} \
            -t 15000 \
            -r dast_report.html || true

      - name: DAST reports upload
        uses: actions/upload-artifact@v3
        with:
          name: dast-reports
          path: dast_report.html

  deploy:
    needs: [build, sca, sast]
    runs-on: ubuntu-latest
    env:
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      VPS_IP: ${{ secrets.VPS_IP }}
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/edx-platform:latest

      - name: Prepare SSH environment
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.VPS_IP }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Backup current container
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.VPS_IP }} << 'EOF'
          docker container prune -f
          docker image prune -f
          docker commit edx-platform ${{ env.DOCKER_REGISTRY }}/edx-platform:backup-$(date +%Y%m%d%H%M%S) || true
          EOF

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ env.DEPLOY_USER }}@${{ env.VPS_IP }} << 'EOF'
          set -euxo pipefail

          # Остановка и удаление существующего контейнера
          if [ "$(docker ps -aq -f name=edx-platform)" ]; then
            docker stop edx-platform
            docker rm edx-platform
          fi

          # Загрузка нового образа
          docker pull ${{ env.DOCKER_REGISTRY }}/edx-platform:latest

          # Запуск нового контейнера
          docker run -d --name edx-platform \
            -p 80:80 \
            -e ENV=production \
            ${{ env.DOCKER_REGISTRY }}/edx-platform:latest

          # Ожидание запуска сервиса
          sleep 60

          # Проверка работоспособности сервиса
          if ! curl --silent --head --fail http://localhost; then
            echo "Service is not responding, rolling back..."
            docker stop edx-platform
            docker rm edx-platform
            exit 1
          fi
          EOF

      - name: Clean up old backups
        if: always()
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.VPS_IP }} << 'EOF'
          # Очистка образов старше 7 дней
          docker images --filter "reference=${{ env.DOCKER_REGISTRY }}/edx-platform:backup-*" --format "{{.ID}} {{.CreatedSince}}" | \
          grep -E "([5-9][0-9]|1[0-9][0-9]) days|[2-9][0-9][0-9] days" | \
          awk '{print $1}' | \
          xargs -r docker rmi || true
          EOF
