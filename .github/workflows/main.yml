name: edX CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Сборка и тестирование Docker образа
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: edx-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/edx-platform.tar

      - name: Load and test Docker image
        run: |
          echo "Loading Docker image..."
          docker load -i /tmp/edx-platform.tar
          
          echo "Testing if container starts..."
          docker run --rm -d --name test-container -p 8000:80 edx-platform:latest
          sleep 10
          
          echo "Checking container status..."
          docker ps | grep test-container && echo "✅ Container is running" || echo "❌ Container failed to start"
          
          echo "Stopping test container..."
          docker stop test-container && echo "✅ Test container stopped"

  # Сканирование безопасности контейнера
  sca:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Build and scan
        run: |
          # Собираем образ
          docker build -t edx-platform:scan .
          
          # Устанавливаем Trivy
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          
          # Запускаем сканирование
          echo "🔒 Running security scan..."
          trivy image --severity CRITICAL,HIGH --exit-code 0 edx-platform:scan
          echo "✅ Security scan completed"

      - name: Upload simple report
        run: |
          echo "Security scan finished at: $(date)" > security-scan.txt
          echo "Image: edx-platform:scan" >> security-scan.txt
          echo "Status: Completed" >> security-scan.txt

      - name: Upload scan summary
        uses: actions/upload-artifact@v4
        with:
          name: sca-summary
          path: security-scan.txt

  # Статический анализ кода
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install SAST tools
        run: |
          pip install bandit safety semgrep

      - name: Run Bandit security scan
        run: |
          bandit -r . -f json -o bandit-report.json . || echo "Bandit scan completed"

      - name: Run Safety dependencies check
        run: |
          safety check --json --output safety-report.json || echo "Safety check completed"

      - name: Run Semgrep static analysis
        run: |
          semgrep scan --config=auto --json -o semgrep-report.json || echo "Semgrep scan completed"

      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            bandit-report.json
            safety-report.json
            semgrep-report.json

  # Деплой на сервер
  deploy:
    needs: [build, sca, sast]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: edx-platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/edx-platform.tar.gz

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          echo "Starting deployment to ${{ secrets.SERVER_IP }}..."
          scp /tmp/edx-platform.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/tmp/
          
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          set -e
          echo "=== Starting deployment ==="
          
          # Загружаем образ
          echo "Loading Docker image..."
          docker load -i /tmp/edx-platform.tar.gz
          
          # Останавливаем старый контейнер если существует
          echo "Stopping old container..."
          docker stop edx-platform || true
          docker rm edx-platform || true
          
          # Запускаем новый контейнер
          echo "Starting new container..."
          docker run -d \
            --name edx-platform \
            --restart unless-stopped \
            -p 80:80 \
            edx-platform:${{ github.sha }}
          
          # Очистка
          rm /tmp/edx-platform.tar.gz
          echo "=== Deployment completed ==="
          EOF

      - name: Verify deployment
        run: |
          echo "Waiting for application to start..."
          sleep 30
          echo "Verifying deployment..."
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          set -e
          echo "=== Verification ==="
          echo "Container status:"
          docker ps | grep edx-platform && echo "✅ Container is running" || echo "❌ Container not found"
          echo "Application health check:"
          curl -f http://localhost:80/ && echo "✅ Application is responding" || echo "❌ Application health check failed"
          echo "=== Verification completed ==="
          EOF

      - name: Store application URL for DAST
        run: |
          echo "APPLICATION_URL=http://${{ secrets.SERVER_IP }}" >> $GITHUB_ENV
          echo "DAST target set to: http://${{ secrets.SERVER_IP }}"

      - name: Send deployment notification
        run: |
          echo "🎉 Application successfully deployed to ${{ secrets.SERVER_IP }}"
          echo "🌐 Access your application at: http://${{ secrets.SERVER_IP }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "🚀 Deployed from branch: ${GITHUB_REF#refs/heads/}"

  # Динамический анализ безопасности (DAST)
  dast:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  # DAST только для production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for application to be ready
        run: |
          echo "Waiting for application to be fully ready..."
          timeout 120s bash -c '
            until curl -f -s http://${{ secrets.SERVER_IP }}/ > /dev/null; do
              echo "Waiting for application...";
              sleep 10;
            done
          ' && echo "✅ Application is ready for DAST scanning" || echo "⚠️ Application readiness check timeout"

      - name: Install DAST tools
        run: |
          echo "Installing DAST security tools..."
          # Устанавливаем Nuclei для сканирования уязвимостей
          curl -sL https://raw.githubusercontent.com/projectdiscovery/nuclei/master/install.sh | sh
          # Устанавливаем Nikto для сканирования web сервера
          sudo apt-get update && sudo apt-get install -y nikto
          # Устанавливаем OWASP ZAP
          wget https://github.com/zaproxy/zaproxy/releases/download/v2.14.0/ZAP_2.14.0_Linux.tar.gz
          tar -xzf ZAP_2.14.0_Linux.tar.gz
          sudo mv ZAP_2.14.0 /opt/zap

      - name: Run Nuclei vulnerability scan
        run: |
          echo "🔍 Running Nuclei vulnerability scan..."
          ./bin/nuclei -u http://${{ secrets.SERVER_IP }} \
            -severity critical,high,medium \
            -rate-limit 10 \
            -timeout 30 \
            -o nuclei-results.json \
            -json || echo "Nuclei scan completed"

      - name: Run Nikto web server scan
        run: |
          echo "🔍 Running Nikto web server scan..."
          nikto -h http://${{ secrets.SERVER_IP }} \
            -o nikto-results.txt \
            -Format txt || echo "Nikto scan completed"

      - name: Run basic security headers check
        run: |
          echo "🔍 Checking security headers..."
          curl -I http://${{ secrets.SERVER_IP }} > security-headers.txt
          echo "=== Security Headers Analysis ===" >> security-headers.txt
          echo "" >> security-headers.txt
          
          # Проверяем основные security headers
          if grep -q "X-Frame-Options" security-headers.txt; then
            echo "✅ X-Frame-Options: Present" >> security-headers.txt
          else
            echo "❌ X-Frame-Options: Missing" >> security-headers.txt
          fi
          
          if grep -q "X-Content-Type-Options" security-headers.txt; then
            echo "✅ X-Content-Type-Options: Present" >> security-headers.txt
          else
            echo "❌ X-Content-Type-Options: Missing" >> security-headers.txt
          fi
          
          if grep -q "Content-Security-Policy" security-headers.txt; then
            echo "✅ Content-Security-Policy: Present" >> security-headers.txt
          else
            echo "❌ Content-Security-Policy: Missing" >> security-headers.txt
          fi

      - name: Run OWASP ZAP baseline scan
        run: |
          echo "🔍 Running OWASP ZAP baseline scan..."
          /opt/zap/zap.sh -cmd \
            -quickurl http://${{ secrets.SERVER_IP }} \
            -quickout zap-results.html \
            -quickprogress || echo "ZAP scan completed"

      - name: Generate DAST summary report
        run: |
          echo "📊 DAST Scan Summary Report" > dast-summary.md
          echo "=============================" >> dast-summary.md
          echo "" >> dast-summary.md
          echo "**Scan Date:** $(date)" >> dast-summary.md
          echo "**Target:** http://${{ secrets.SERVER_IP }}" >> dast-summary.md
          echo "**Scan Tools:** Nuclei, Nikto, OWASP ZAP" >> dast-summary.md
          echo "" >> dast-summary.md
          
          # Nuclei results summary
          if [ -f "nuclei-results.json" ]; then
            NUCLEI_COUNT=$(jq '. | length' nuclei-results.json 2>/dev/null || echo "0")
            echo "**Nuclei Findings:** $NUCLEI_COUNT vulnerabilities detected" >> dast-summary.md
          else
            echo "**Nuclei Findings:** No results available" >> dast-summary.md
          fi
          
          # Nikto results summary
          if [ -f "nikto-results.txt" ]; then
            NIKTO_ISSUES=$(grep -c "+" nikto-results.txt 2>/dev/null || echo "0")
            echo "**Nikto Findings:** $NIKTO_ISSUES issues detected" >> dast-summary.md
          else
            echo "**Nikto Findings:** No results available" >> dast-summary.md
          fi
          
          echo "" >> dast-summary.md
          echo "## Security Headers Status" >> dast-summary.md
          cat security-headers.txt >> dast-summary.md

      - name: Upload DAST reports
        uses: actions/upload-artifact@v4
        with:
          name: dast-reports
          path: |
            nuclei-results.json
            nikto-results.txt
            security-headers.txt
            zap-results.html
            dast-summary.md
          retention-days: 30

      - name: DAST completion summary
        run: |
          echo "🎯 DAST Security Testing Completed"
          echo "=================================="
          echo "📊 Scan Results Summary:"
          echo "  • Nuclei: Vulnerability scanning"
          echo "  • Nikto: Web server security"
          echo "  • OWASP ZAP: Application security"
          echo "  • Security Headers: HTTP headers analysis"
          echo ""
          echo "📁 Detailed reports available as artifact: dast-reports"
          echo "🔍 Download from Actions to review security findings"
